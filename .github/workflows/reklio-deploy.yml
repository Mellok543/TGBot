name: Deploy Reklio to VPS

on:
  workflow_dispatch:
    inputs:
      diagnostics_only:
        description: 'Run VPS diagnostics without deployment'
        type: boolean
        required: false
        default: false
      apply_publications_migration:
        description: 'Back up Reklio database and apply publications migration (no publishing enabled)'
        type: boolean
        required: false
        default: false
  push:
    branches:
      - feature/miniapp-typescript-foundation

permissions:
  contents: read

concurrency:
  group: reklio-production-deploy
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.diagnostics_only && !inputs.apply_publications_migration }}
    name: Build and validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate deployment script
        run: bash -n deploy/reklio-deploy.sh
      - name: Validate MTProto monitor Python syntax
        run: python3 -m py_compile deploy/reklio_mtproto_monitor.py deploy/probe_mtproto_post.py
      - name: Build API
        run: dotnet publish src/TelegramManager.Api/TelegramManager.Api.csproj -c Release -o /tmp/reklio-api-verify
      - name: Build Mini App
        working-directory: miniapp
        env:
          VITE_API_URL: https://api.reklio.site
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm run build
      - name: Confirm migrations are versioned
        run: |
          test -f deploy/migrations/001_reklio_payments.sql
          test -f deploy/migrations/002_reklio_publications.sql
          echo "Database migrations require separate review and are NOT applied automatically."
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/feature/miniapp-typescript-foundation' && (github.event_name != 'workflow_dispatch' || !inputs.diagnostics_only && !inputs.apply_publications_migration)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Configure SSH
        env:
          DEPLOY_KEY_B64: ${{ secrets.REKLIO_DEPLOY_SSH_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.REKLIO_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY_B64" && test -n "$KNOWN_HOSTS"
          umask 077
          mkdir -p ~/.ssh
          printf '%s' "$DEPLOY_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Deploy Mini App and API
        env:
          DEPLOY_HOST: ${{ secrets.REKLIO_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.REKLIO_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.REKLIO_DEPLOY_PORT }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER"
          PORT="${DEPLOY_PORT:-22}"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -p "$PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            'sudo -n /usr/local/sbin/reklio-deploy'
      - name: Verify public Mini App assets
        run: |
          set -euo pipefail
          html="$(curl --fail --silent --show-error --max-time 15 https://reklio.site/)"
          for ext in js css; do
            asset="$(printf '%s' "$html" | grep -oE "/assets/[^\\\" ]+\\.$ext" | head -n 1 || true)"
            if [[ -z "$asset" ]]; then
              echo "Missing $ext reference in public HTML" >&2
              exit 1
            fi
            content_type="$(curl --fail --silent --show-error --max-time 15 -o /dev/null -w '%{content_type}' "https://reklio.site$asset")"
            echo "$ext: $asset ($content_type)"
            case "$ext:$content_type" in
              js:*javascript*|css:text/css*) ;;
              *) echo "Incorrect $ext content type: $content_type" >&2; exit 1 ;;
            esac
          done
      - name: Verify public catalog and Mini App CORS
        run: |
          set -euo pipefail
          status="$(curl -sS --max-time 15 -o /tmp/reklio-catalog.json -w '%{http_code}' https://api.reklio.site/api/public/channels?limit=3)"
          echo "Public catalog HTTP $status"
          if [[ "$status" != "200" ]]; then
            head -c 1000 /tmp/reklio-catalog.json
            exit 1
          fi
          cors="$(curl -sS -D - -o /dev/null --max-time 15 -H 'Origin: https://reklio.site' https://api.reklio.site/api/channels | tr -d '\r')"
          echo "$cors" | grep -i 'access-control-allow-origin: https://reklio.site'
          echo "$cors" | head -n 15
      - name: Verify public API
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 10 https://api.reklio.site/api/health | grep -q '"ok"'; then
              echo 'Reklio API is healthy'
              exit 0
            fi
            sleep 3
          done
          echo 'Reklio API health check failed' >&2
          exit 1

  mtproto_preflight:
    name: MTProto VPS readiness (read-only)
    if: github.ref == 'refs/heads/feature/miniapp-typescript-foundation' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        env:
          DEPLOY_KEY_B64: ${{ secrets.REKLIO_DEPLOY_SSH_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.REKLIO_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY_B64" && test -n "$KNOWN_HOSTS"
          umask 077
          mkdir -p ~/.ssh
          printf '%s' "$DEPLOY_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Inspect prerequisites without revealing credentials
        env:
          DEPLOY_HOST: ${{ secrets.REKLIO_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.REKLIO_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.REKLIO_DEPLOY_PORT }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -eu
          echo "service: $(systemctl is-enabled reklio-mtproto-monitor.service 2>/dev/null || true)"
          echo "systemd-unit: $(test -f /etc/systemd/system/reklio-mtproto-monitor.service && echo present || echo missing)"
          echo "python3: $(command -v python3 >/dev/null && echo present || echo missing)"
          echo "crontab: $(command -v crontab >/dev/null && echo present || echo missing)"
          echo "db-client-config: $(test -r "$HOME/.my.cnf" && echo present || echo missing)"
          echo "ssh-user: $(id -un)"
          echo "venv: $(test -x /opt/reklio/mtproto-venv/bin/python && echo present || echo missing)"
          echo "monitor-env: $(test -f /etc/reklio/mtproto-monitor.env && echo present || echo missing)"
          echo "database-migration: $(if mariadb --defaults-extra-file="$HOME/.my.cnf" --batch --skip-column-names -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='s2_telegram_manager' AND table_name='reklio_post_monitor';" 2>/dev/null | grep -qx '1'; then echo applied; else echo missing-or-unavailable; fi)"
          REMOTE

  mtproto_install:
    name: Install MTProto monitor (deploy account)
    if: github.ref == 'refs/heads/feature/miniapp-typescript-foundation' && github.event_name == 'push'
    needs: deploy
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          DEPLOY_KEY_B64: ${{ secrets.REKLIO_DEPLOY_SSH_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.REKLIO_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY_B64" && test -n "$KNOWN_HOSTS"
          umask 077
          mkdir -p ~/.ssh
          printf '%s' "$DEPLOY_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Prepare portable pure-Python monitor dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --target /tmp/reklio-mtproto-deps 'telethon==1.42.0' 'PyMySQL==1.1.1'
          test -f /tmp/reklio-mtproto-deps/telethon/__init__.py
          test -f /tmp/reklio-mtproto-deps/pymysql/__init__.py
      - name: Transfer monitor dependencies
        env:
          DEPLOY_HOST: ${{ secrets.REKLIO_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.REKLIO_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.REKLIO_DEPLOY_PORT }}
        run: |
          set -euo pipefail
          tar -czf - -C /tmp/reklio-mtproto-deps . |
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
              -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" \
              'mkdir -p "$HOME/.local/share/reklio-mtproto/vendor" &&
               chmod 700 "$HOME/.local/share/reklio-mtproto" &&
               tar -xzf - -C "$HOME/.local/share/reklio-mtproto/vendor"'
      - name: Install and start public-channel checks
        env:
          DEPLOY_HOST: ${{ secrets.REKLIO_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.REKLIO_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.REKLIO_DEPLOY_PORT }}
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          REKLIO_BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER"
          test -n "$API_ID" && test -n "$API_HASH" && test -n "$REKLIO_BOT_TOKEN"
          printf '%s\n%s\n%s\n' "$API_ID" "$API_HASH" "$REKLIO_BOT_TOKEN" |
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
              -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" \
              'bash /opt/reklio/source/deploy/install-mtproto-unprivileged.sh'
  bot_token_preflight:
    name: Inspect API token configuration (no secrets)
    if: github.ref == 'refs/heads/feature/miniapp-typescript-foundation' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Configure SSH
        env:
          DEPLOY_KEY_B64: ${{ secrets.REKLIO_DEPLOY_SSH_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.REKLIO_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY_B64" && test -n "$KNOWN_HOSTS"
          umask 077
          mkdir -p ~/.ssh
          printf '%s' "$DEPLOY_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Inspect service configuration and permissions only
        env:
          DEPLOY_HOST: ${{ secrets.REKLIO_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.REKLIO_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.REKLIO_DEPLOY_PORT }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -eu
          echo '=== API token rotation prerequisites ==='
          echo "api-service: $(systemctl is-active reklio-api.service || true)"
          echo "service-envfiles: $(systemctl show reklio-api.service -p EnvironmentFiles --value | sed -E 's/\([^)]*\)//g' | cut -c1-300)"
          echo "sudo-access: $(if sudo -n true 2>/dev/null; then echo broad; else echo restricted; fi)"
          echo "monitor-cron: $(if crontab -l 2>/dev/null | grep -q '# reklio-mtproto'; then echo present; else echo missing; fi)"
          REMOTE

  diagnostics:
    name: Read-only VPS diagnostics
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostics_only && !inputs.apply_publications_migration }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Configure SSH
        env:
          DEPLOY_KEY_B64: ${{ secrets.REKLIO_DEPLOY_SSH_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.REKLIO_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY_B64" && test -n "$KNOWN_HOSTS"
          umask 077
          mkdir -p ~/.ssh
          printf '%s' "$DEPLOY_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Public endpoints
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 https://api.reklio.site/api/health
          echo
          curl --fail --silent --show-error --max-time 15 -o /dev/null -w 'Mini App HTTP %{http_code}\n' https://reklio.site/
      - name: VPS service checks
        env:
          DEPLOY_HOST: ${{ secrets.REKLIO_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.REKLIO_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.REKLIO_DEPLOY_PORT }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER"
          PORT="${DEPLOY_PORT:-22}"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -p "$PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -eu
          echo '=== UTC ==='
          date -u '+%Y-%m-%dT%H:%M:%SZ'
          echo '=== SERVICES ==='
          systemctl is-active reklio-api.service || true
          systemctl is-active nginx.service || true
          echo '=== LOCAL API ==='
          curl --fail --silent --show-error --max-time 5 http://127.0.0.1:5080/api/health || true
          echo
          echo '=== DISK ==='
          df -h /opt/reklio | tail -n 1
          echo '=== SOURCE REVISION ==='
          git -c safe.directory=/opt/reklio/source -C /opt/reklio/source rev-parse --short HEAD || true
          echo '=== RELATED SERVICE NAMES ==='
          systemctl list-units --type=service --all --no-legend --no-pager | awk '{print $1}' | grep -Ei 'reklio|telegram' || true
          echo '=== DATABASE CONNECTIVITY ==='
          if ! command -v mariadb >/dev/null 2>&1; then
            echo 'MariaDB client unavailable'
            exit 1
          fi
          if [ ! -r "$HOME/.my.cnf" ]; then
            echo 'MariaDB credentials not configured for SSH deploy account'
            exit 1
          fi
          mariadb --defaults-extra-file="$HOME/.my.cnf" --batch --skip-column-names \
            -e 'SELECT 1' | grep -qx '1'
          echo 'MariaDB authentication OK'
          echo '=== TEST CHANNEL LOOKUP ==='
          mariadb --defaults-extra-file="$HOME/.my.cnf" --batch --skip-column-names \
            -e "SELECT telegram_id,username,title FROM s2_telegram_manager.channels WHERE LOWER(REPLACE(COALESCE(username,''),'@',''))='testchanel54' LIMIT 5;"
          echo '=== REKLIO DATABASE TABLES ==='
          mariadb --defaults-extra-file="$HOME/.my.cnf" --batch --skip-column-names \
            -e "SELECT TABLE_SCHEMA, TABLE_NAME FROM information_schema.TABLES WHERE TABLE_SCHEMA NOT IN ('mysql','information_schema','performance_schema','sys') AND TABLE_NAME IN ('ad_requests','notification_outbox','reklio_publications','reklio_payment_attempts','reklio_payment_events') ORDER BY TABLE_SCHEMA,TABLE_NAME;"
          REMOTE

  migrate_publications:
    name: Back up database and apply publications migration
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_publications_migration && !inputs.diagnostics_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Configure SSH
        env:
          DEPLOY_KEY_B64: ${{ secrets.REKLIO_DEPLOY_SSH_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.REKLIO_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY_B64" && test -n "$KNOWN_HOSTS"
          umask 077
          mkdir -p ~/.ssh
          printf '%s' "$DEPLOY_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Backup and migrate
        env:
          DEPLOY_HOST: ${{ secrets.REKLIO_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.REKLIO_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.REKLIO_DEPLOY_PORT }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER"
          PORT="${DEPLOY_PORT:-22}"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -p "$PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          DB=s2_telegram_manager
          MIGRATION=/opt/reklio/source/deploy/migrations/002_reklio_publications.sql
          test -r "$HOME/.my.cnf"
          test -r "$MIGRATION"
          grep -q 'CREATE TABLE IF NOT EXISTS reklio_publications' "$MIGRATION"
          mkdir -p "$HOME/reklio-db-backups"
          chmod 700 "$HOME/reklio-db-backups"
          BACKUP="$HOME/reklio-db-backups/${DB}-before-publications-$(date -u +%Y%m%dT%H%M%SZ).sql"
          umask 077
          echo 'Creating database backup...'
          mariadb-dump --defaults-extra-file="$HOME/.my.cnf" --single-transaction --routines --triggers --events "$DB" > "$BACKUP"
          test -s "$BACKUP"
          echo "Backup created: $BACKUP"
          echo 'Applying publications migration...'
          mariadb --defaults-extra-file="$HOME/.my.cnf" "$DB" < "$MIGRATION"
          echo 'Checking publications table...'
          mariadb --defaults-extra-file="$HOME/.my.cnf" --batch --skip-column-names \
            -e "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA='$DB' AND TABLE_NAME='reklio_publications';" | grep -qx '1'
          echo 'Publications table exists. Publishing remains disabled.'
          REMOTE
