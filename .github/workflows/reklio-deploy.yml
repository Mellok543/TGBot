name: Deploy Reklio to VPS

on:
  workflow_dispatch:
    inputs:
      diagnostics_only:
        description: 'Run VPS diagnostics without deployment'
        type: boolean
        required: false
        default: false
      apply_publications_migration:
        description: 'Back up Reklio database and apply publications migration (no publishing enabled)'
        type: boolean
        required: false
        default: false
  push:
    branches:
      - feature/miniapp-typescript-foundation

permissions:
  contents: read

concurrency:
  group: reklio-production-deploy
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.diagnostics_only && !inputs.apply_publications_migration }}
    name: Build and validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate deployment script
        run: bash -n deploy/reklio-deploy.sh
      - name: Build API
        run: dotnet publish src/TelegramManager.Api/TelegramManager.Api.csproj -c Release -o /tmp/reklio-api-verify
      - name: Build Mini App
        working-directory: miniapp
        env:
          VITE_API_URL: https://api.reklio.site
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm run build
      - name: Confirm migrations are versioned
        run: |
          test -f deploy/migrations/001_reklio_payments.sql
          test -f deploy/migrations/002_reklio_publications.sql
          echo "Database migrations require separate review and are NOT applied automatically."
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/feature/miniapp-typescript-foundation' && (github.event_name != 'workflow_dispatch' || !inputs.diagnostics_only && !inputs.apply_publications_migration)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Configure SSH
        env:
          DEPLOY_KEY_B64: ${{ secrets.REKLIO_DEPLOY_SSH_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.REKLIO_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY_B64" && test -n "$KNOWN_HOSTS"
          umask 077
          mkdir -p ~/.ssh
          printf '%s' "$DEPLOY_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Deploy Mini App and API
        env:
          DEPLOY_HOST: ${{ secrets.REKLIO_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.REKLIO_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.REKLIO_DEPLOY_PORT }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER"
          PORT="${DEPLOY_PORT:-22}"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -p "$PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            'sudo -n /usr/local/sbin/reklio-deploy'
      - name: Verify public API
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 10 https://api.reklio.site/api/health | grep -q '"ok"'; then
              echo 'Reklio API is healthy'
              exit 0
            fi
            sleep 3
          done
          echo 'Reklio API health check failed' >&2
          exit 1

  diagnostics:
    name: Read-only VPS diagnostics
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostics_only && !inputs.apply_publications_migration }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Configure SSH
        env:
          DEPLOY_KEY_B64: ${{ secrets.REKLIO_DEPLOY_SSH_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.REKLIO_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY_B64" && test -n "$KNOWN_HOSTS"
          umask 077
          mkdir -p ~/.ssh
          printf '%s' "$DEPLOY_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Public endpoints
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 https://api.reklio.site/api/health
          echo
          curl --fail --silent --show-error --max-time 15 -o /dev/null -w 'Mini App HTTP %{http_code}\n' https://reklio.site/
      - name: VPS service checks
        env:
          DEPLOY_HOST: ${{ secrets.REKLIO_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.REKLIO_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.REKLIO_DEPLOY_PORT }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER"
          PORT="${DEPLOY_PORT:-22}"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -p "$PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -eu
          echo '=== UTC ==='
          date -u '+%Y-%m-%dT%H:%M:%SZ'
          echo '=== SERVICES ==='
          systemctl is-active reklio-api.service || true
          systemctl is-active nginx.service || true
          echo '=== LOCAL API ==='
          curl --fail --silent --show-error --max-time 5 http://127.0.0.1:5080/api/health || true
          echo
          echo '=== DISK ==='
          df -h /opt/reklio | tail -n 1
          echo '=== SOURCE REVISION ==='
          git -c safe.directory=/opt/reklio/source -C /opt/reklio/source rev-parse --short HEAD || true
          echo '=== RELATED SERVICE NAMES ==='
          systemctl list-units --type=service --all --no-legend --no-pager | awk '{print $1}' | grep -Ei 'reklio|telegram' || true
          echo '=== DATABASE CONNECTIVITY ==='
          if ! command -v mariadb >/dev/null 2>&1; then
            echo 'MariaDB client unavailable'
            exit 1
          fi
          if [ ! -r "$HOME/.my.cnf" ]; then
            echo 'MariaDB credentials not configured for SSH deploy account'
            exit 1
          fi
          mariadb --defaults-extra-file="$HOME/.my.cnf" --batch --skip-column-names \
            -e 'SELECT 1' | grep -qx '1'
          echo 'MariaDB authentication OK'
          echo '=== TEST CHANNEL LOOKUP ==='
          mariadb --defaults-extra-file="$HOME/.my.cnf" --batch --skip-column-names \
            -e "SELECT telegram_id,username,title FROM s2_telegram_manager.channels WHERE LOWER(REPLACE(COALESCE(username,''),'@',''))='testchanel54' LIMIT 5;"
          echo '=== REKLIO DATABASE TABLES ==='
          mariadb --defaults-extra-file="$HOME/.my.cnf" --batch --skip-column-names \
            -e "SELECT TABLE_SCHEMA, TABLE_NAME FROM information_schema.TABLES WHERE TABLE_SCHEMA NOT IN ('mysql','information_schema','performance_schema','sys') AND TABLE_NAME IN ('ad_requests','notification_outbox','reklio_publications','reklio_payment_attempts','reklio_payment_events') ORDER BY TABLE_SCHEMA,TABLE_NAME;"
          REMOTE

  migrate_publications:
    name: Back up database and apply publications migration
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_publications_migration && !inputs.diagnostics_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Configure SSH
        env:
          DEPLOY_KEY_B64: ${{ secrets.REKLIO_DEPLOY_SSH_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.REKLIO_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY_B64" && test -n "$KNOWN_HOSTS"
          umask 077
          mkdir -p ~/.ssh
          printf '%s' "$DEPLOY_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Backup and migrate
        env:
          DEPLOY_HOST: ${{ secrets.REKLIO_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.REKLIO_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.REKLIO_DEPLOY_PORT }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER"
          PORT="${DEPLOY_PORT:-22}"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -p "$PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          DB=s2_telegram_manager
          MIGRATION=/opt/reklio/source/deploy/migrations/002_reklio_publications.sql
          test -r "$HOME/.my.cnf"
          test -r "$MIGRATION"
          grep -q 'CREATE TABLE IF NOT EXISTS reklio_publications' "$MIGRATION"
          mkdir -p "$HOME/reklio-db-backups"
          chmod 700 "$HOME/reklio-db-backups"
          BACKUP="$HOME/reklio-db-backups/${DB}-before-publications-$(date -u +%Y%m%dT%H%M%SZ).sql"
          umask 077
          echo 'Creating database backup...'
          mariadb-dump --defaults-extra-file="$HOME/.my.cnf" --single-transaction --routines --triggers --events "$DB" > "$BACKUP"
          test -s "$BACKUP"
          echo "Backup created: $BACKUP"
          echo 'Applying publications migration...'
          mariadb --defaults-extra-file="$HOME/.my.cnf" "$DB" < "$MIGRATION"
          echo 'Checking publications table...'
          mariadb --defaults-extra-file="$HOME/.my.cnf" --batch --skip-column-names \
            -e "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA='$DB' AND TABLE_NAME='reklio_publications';" | grep -qx '1'
          echo 'Publications table exists. Publishing remains disabled.'
          REMOTE
