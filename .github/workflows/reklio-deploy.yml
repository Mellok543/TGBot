name: Deploy Reklio to VPS

on:
  workflow_dispatch:
  push:
    branches:
      - feature/miniapp-typescript-foundation

permissions:
  contents: read

concurrency:
  group: reklio-production-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: Build and validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate deployment script
        run: bash -n deploy/reklio-deploy.sh
      - name: Build API
        run: dotnet publish src/TelegramManager.Api/TelegramManager.Api.csproj -c Release -o /tmp/reklio-api-verify
      - name: Build Mini App
        working-directory: miniapp
        env:
          VITE_API_URL: https://api.reklio.site
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm run build
      - name: Confirm migrations are versioned
        run: |
          test -f deploy/migrations/001_reklio_payments.sql
          test -f deploy/migrations/002_reklio_publications.sql
          echo "Database migrations require separate review and are NOT applied automatically."
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/feature/miniapp-typescript-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Configure SSH
        env:
          DEPLOY_KEY_B64: ${{ secrets.REKLIO_DEPLOY_SSH_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.REKLIO_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY_B64" && test -n "$KNOWN_HOSTS"
          umask 077
          mkdir -p ~/.ssh
          printf '%s' "$DEPLOY_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Deploy Mini App and API
        env:
          DEPLOY_HOST: ${{ secrets.REKLIO_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.REKLIO_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.REKLIO_DEPLOY_PORT }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER"
          PORT="${DEPLOY_PORT:-22}"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -p "$PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            'sudo -n /usr/local/sbin/reklio-deploy'
      - name: Verify public API
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 10 https://api.reklio.site/api/health | grep -q '"ok"'; then
              echo 'Reklio API is healthy'
              exit 0
            fi
            sleep 3
          done
          echo 'Reklio API health check failed' >&2
          exit 1
