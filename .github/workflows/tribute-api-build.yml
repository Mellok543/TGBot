name: Reklio API build
on:
  push:
    branches:
      - feature/miniapp-typescript-foundation
  pull_request:
  workflow_dispatch:
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore src/TelegramManager.Api/TelegramManager.Api.csproj
      - name: Build
        run: dotnet build src/TelegramManager.Api/TelegramManager.Api.csproj --configuration Release --no-restore
