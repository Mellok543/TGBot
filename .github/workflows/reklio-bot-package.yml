name: Reklio Bot ZIP for Pterodactyl

on:
  push:
    branches:
      - feature/miniapp-typescript-foundation
    paths:
      - 'src/TelegramManager.Bot/**'
      - '.github/workflows/reklio-bot-package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish bot
        run: dotnet publish src/TelegramManager.Bot/TelegramManager.Bot.csproj -c Release -r linux-x64 --self-contained false -o bot-publish
      - name: Make ZIP
        run: |
          cd bot-publish
          zip -qr ../ReklioBot-Pterodactyl-linux-x64.zip .
      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReklioBot-Pterodactyl-linux-x64
          path: ReklioBot-Pterodactyl-linux-x64.zip
          retention-days: 30
