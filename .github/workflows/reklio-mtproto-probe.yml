name: Reklio MTProto bot probe

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Public channel @username (preferred)'
        required: true
        type: string
      message_id:
        description: 'Existing post ID; rerun after manual deletion'
        required: true
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install MTProto client
        run: python -m pip install 'telethon==1.42.0'
      - name: Probe post with Reklio Bot identity
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL: ${{ inputs.channel }}
          MESSAGE_ID: ${{ inputs.message_id }}
        run: python deploy/probe_mtproto_post.py --channel "$CHANNEL" --message-id "$MESSAGE_ID"
