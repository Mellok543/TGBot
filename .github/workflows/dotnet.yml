name: .NET build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore src/TelegramManager.Bot/TelegramManager.Bot.csproj
      - name: Build
        run: dotnet build src/TelegramManager.Bot/TelegramManager.Bot.csproj --configuration Release --no-restore
      - name: Publish
        run: dotnet publish src/TelegramManager.Bot/TelegramManager.Bot.csproj --configuration Release --no-restore --output publish
      - uses: actions/upload-artifact@v4
        with:
          name: telegram-manager
          path: publish/
