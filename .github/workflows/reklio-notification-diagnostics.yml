name: Reklio notification diagnostics
on:
  push:
    branches: [feature/miniapp-typescript-foundation]
    paths: [.github/workflows/reklio-notification-diagnostics.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: SSH setup
        env:
          KEY: ${{ secrets.REKLIO_DEPLOY_SSH_KEY_B64 }}
          HOSTS: ${{ secrets.REKLIO_SSH_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf %s "$KEY" | base64 -d > ~/.ssh/id_ed25519
          printf '%s\n' "$HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Check active notification worker without exposing secrets
        env:
          H: ${{ secrets.REKLIO_DEPLOY_HOST }}
          U: ${{ secrets.REKLIO_DEPLOY_USER }}
          P: ${{ secrets.REKLIO_DEPLOY_PORT }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -p "${P:-22}" "$U@$H" 'bash -s' <<'REMOTE'
          set -eu
          echo "service: $(systemctl is-active reklio-api.service || true)"
          echo "worker logs (last 40, redacted):"
          journalctl -u reklio-api.service --since '30 minutes ago' --no-pager -o cat 2>/dev/null |
            grep -Ei 'notification delivery|inline actions|Reklio notification delivery|Notification [0-9]+|error' |
            sed -E 's/[0-9]{8,}/[ID]/g' | tail -40 || true
          if test -r "$HOME/.my.cnf" && command -v mariadb >/dev/null; then
            echo 'Recent outbox entries (order id, state, linked owner, order status):'
            mariadb --defaults-extra-file="$HOME/.my.cnf" --batch --skip-column-names s2_telegram_manager -e "
              SELECT n.order_id,n.state,
                     CASE WHEN a.owner_id=n.recipient_id THEN 'owner' ELSE 'not-owner' END,
                     COALESCE(a.status,'missing')
              FROM notification_outbox n LEFT JOIN ad_requests a ON a.id=n.order_id
              WHERE n.body LIKE 'Новая заявка%'
              ORDER BY n.id DESC LIMIT 12;" 2>/dev/null || echo 'db inspection unavailable'
          fi
          echo "api binary deployed: $(stat -c '%y' /opt/reklio/api/TelegramManager.Api.dll 2>/dev/null || echo unavailable)"
          echo "new worker phrase in binary: $(if grep -aq 'New order notification' /opt/reklio/api/TelegramManager.Api.dll 2>/dev/null; then echo yes; else echo unknown; fi)"
          echo 'latest owner request notifications:'
          mariadb --defaults-extra-file="$HOME/.my.cnf" -N s2_telegram_manager -e "SELECT n.id,n.order_id,n.state,LEFT(n.body,30),a.status FROM notification_outbox n LEFT JOIN ad_requests a ON a.id=n.order_id WHERE n.body LIKE 'Новая заявка%' ORDER BY n.id DESC LIMIT 8" 2>/dev/null || true
          echo 'Recent notification timestamps:'
          mariadb --defaults-extra-file="$HOME/.my.cnf" -N s2_telegram_manager -e "SELECT n.order_id,n.state,n.created_at,n.sent_at FROM notification_outbox n WHERE n.body LIKE 'Новая заявка%' ORDER BY n.id DESC LIMIT 5" 2>/dev/null || echo 'timestamp columns unavailable'
          echo 'Notification processes:'
          ps -eo pid,lstart,args | grep -E '[T]elegramManager.Api|[r]eklio' | cut -c1-210 | tail -15
          echo "worker phrase in dll UTF16: $(if strings -el /opt/reklio/api/TelegramManager.Api.dll 2>/dev/null | grep -q 'New order notification'; then echo yes; else echo no; fi)"
          REMOTE
